aid: triumph
name: Triumph
description: 'Triumph (Triumph Labs, formerly Triumph Arcade) is a consumer entertainment
  and commerce company backed by General Catalyst, which led its $10.2M Series A —
  part of the $14.1M the company launched with in May 2023. Triumph began as an iOS/Unity
  SDK that let game developers add real-money tournaments to their games, handling
  payments, state-by-state regulatory eligibility (37 US states plus DC at launch),
  matchmaking, and payouts, and today operates two consumer apps: Triumph: Play for
  Cash (competitive cash gaming arcade) and Rips by Triumph (trading-card collectibles).
  The Triumph SDK for Swift and Unity remains documented at docs.triumpharcade.com
  and is distributed via CocoaPods and GitHub, with a developer dashboard at
  dashboard.triumpharcade.com; the company publishes no public REST API.'
